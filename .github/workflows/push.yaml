name: Plugins - CI

on:
  push:
    branches:
      - main
      - renovate/*
  pull_request:

permissions: {}

jobs:
  ci:
    name: CI
    uses: grafana/plugin-ci-workflows/.github/workflows/ci.yml@081ab26ea60f7d93d70f02d66f9f3cc96c15823c # ci-cd-workflows/v6.1.1
    permissions:
      contents: read
      id-token: write
    with:
      plugin-version-suffix: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}

      # CI inputs
      run-playwright: true
      upload-playwright-artifacts: true
      node-version: 22
