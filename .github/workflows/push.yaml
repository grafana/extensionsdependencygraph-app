name: Plugins - CI

on:
  push:
    branches:
      - main
      - renovate/*
  pull_request:

permissions: {}

jobs:
  ci:
    name: CI
    uses: grafana/plugin-ci-workflows/.github/workflows/ci.yml@feat/bump-e2e-version-v2
    permissions:
      contents: read
      id-token: write
    with:
      plugin-version-suffix: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}

      # CI inputs
      run-playwright: true
      upload-playwright-artifacts: true
      node-version: 22
