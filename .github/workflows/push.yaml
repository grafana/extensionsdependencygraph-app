name: Plugins - CI

on:
  push:
    branches:
      - main
      - renovate/*
  pull_request:

permissions: {}

jobs:
  ci:
    name: CI
    uses: grafana/plugin-ci-workflows/.github/workflows/ci.yml@sunker/gar-enterprise-nightly-test
    permissions:
      contents: read
      id-token: write
    with:
      plugin-version-suffix: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}

      # CI inputs
      run-playwright: true
      upload-playwright-artifacts: false
      run-playwright-with-enterprise-nightly-registry: us-docker.pkg.dev/example-project/example-repository
      node-version: 24
