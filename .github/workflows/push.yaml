name: Plugins - CI

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  ci:
    name: CI
    uses: grafana/plugin-ci-workflows/.github/workflows/ci.yml@1aef8fb1e9299aba3c833b2caf4d78aafdc0aced # ci-cd-workflows/v4.2.0
    permissions:
      contents: read
      id-token: write
    with:
      plugin-version-suffix: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}

      # CI inputs
      run-playwright: true
      upload-playwright-artifacts: true
      node-version: 22
